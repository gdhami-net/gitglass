<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitglass demo</title>
<link rel="stylesheet" href="../gitglass.css">
<style>
  body { margin: 0; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 40px; }
  h1 { font-size: 22px; } p { color: #94a3b8; max-width: 640px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>gitglass</h1>
  <p>One div with a <code>data-gitglass</code> attribute. This one browses gitglass's own repo — live from the GitHub API.</p>
  <div data-gitglass="gdhami-net/gitglass"></div>
</div>
<script src="../gitglass.js"></script>
</body>
</html>
